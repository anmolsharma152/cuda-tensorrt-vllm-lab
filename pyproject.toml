[project]
name = "cuda-trt-vllm-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anmolsharma152", email = "31614987+anmolsharma152@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0,<2.3.0",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "tabulate>=0.10.0",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
cuda-trt-vllm-lab = "cuda_trt_vllm_lab:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
